<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte des tradipraticiens — Pharmacopée Camerounaise</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<header class="header">
  <div class="logo">🌿 Pharmacopée Camerounaise</div>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="recherche.html">Rechercher</a>
    <a href="carte.html">Carte des tradipraticiens</a>
    <div id="nav-auth"></div>
  </nav>
</header>

<div class="container">
  <h2 class="section-titre">Localiser un tradipraticien</h2>

  <div class="filtres">
    <select id="filtre-ethnie"><option value="">Toutes les ethnies</option></select>
    <select id="filtre-region"><option value="">Toutes les régions</option></select>
  </div>

  <div id="carte-interactive"></div>

  <h3 class="section-titre">Tradipraticiens validés</h3>
  <div class="liste-tradipraticiens" id="liste-tradipraticiens"></div>
</div>

<footer class="footer">RICTD — Numérique Universitaire — 2025-2026</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/carte.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const [ethnies, regions] = await Promise.all([
      api.get('/ethnies/list.php'),
      api.get('/regions/list.php'),
    ]);
    const selectEthnie = document.getElementById('filtre-ethnie');
    const selectRegion = document.getElementById('filtre-region');
    ethnies.ethnies.forEach(e => selectEthnie.insertAdjacentHTML('beforeend', `<option value="${e.id_ethnie}">${e.nom}</option>`));
    regions.regions.forEach(r => selectRegion.insertAdjacentHTML('beforeend', `<option value="${r.id_region}">${r.nom}</option>`));
  } catch (e) { /* facultatif */ }
});
</script>
</body>
</html>
