<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Pharmacopée Camerounaise</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/header-force.css">
<link rel="stylesheet" href="assets/css/corrections-responsive.css">
</head>
<body>

<header class="header">
  <div class="logo">🌿 Pharmacopée Camerounaise</div>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="recherche.html">Rechercher</a>
    <a href="carte.html">Carte des tradipraticiens</a>
  </nav>
</header>

<div class="form-carte">
  <h2>Connexion</h2>
  <form id="form-login">
    <label for="email">Adresse email</label>
    <input type="email" id="email" required>

    <label for="mot_passe">Mot de passe</label>
    <div class="champ-mot-passe">
      <input type="password" id="mot_passe" required>
      <button type="button" class="bouton-afficher-mdp" data-cible="mot_passe">👁</button>
    </div>

    <div id="erreur-login" class="message-erreur"></div>

    <button type="submit" class="submit">Se connecter</button>
  </form>
  <p class="lien-alt">Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
</div>

<footer class="footer">RICTD — Numérique Universitaire — 2025-2026</footer>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
